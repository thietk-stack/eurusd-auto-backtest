name: QuantMind v2 M1 15-month preregistered cohort research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quantmind_m1_cohorts.yml'
permissions:
  contents: read
jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {month: "2022-01", month_end: "2022-02"}
          - {month: "2022-04", month_end: "2022-05"}
          - {month: "2022-07", month_end: "2022-08"}
          - {month: "2022-10", month_end: "2022-11"}
          - {month: "2023-01", month_end: "2023-02"}
          - {month: "2023-04", month_end: "2023-05"}
          - {month: "2023-07", month_end: "2023-08"}
          - {month: "2023-10", month_end: "2023-11"}
          - {month: "2024-04", month_end: "2024-05"}
          - {month: "2024-07", month_end: "2024-08"}
          - {month: "2024-10", month_end: "2024-11"}
          - {month: "2025-01", month_end: "2025-02"}
          - {month: "2025-04", month_end: "2025-05"}
          - {month: "2025-07", month_end: "2025-08"}
          - {month: "2025-10", month_end: "2025-11"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore identical genuine M1 market data if present
        uses: actions/cache/restore@v4
        with:
          path: m1_market
          key: quantmind-m1-${{ matrix.month }}-${{ github.run_id }}
          restore-keys: |
            quantmind-m1-${{ matrix.month }}-
      - name: Unit tests and quote downloader syntax check
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_quantmind_m1_reclaim.py
          python -m py_compile scripts/quantmind_m1_reclaim.py
          npm install --no-audit --no-fund
          node --check scripts/download_m1_four_pairs.mjs
      - name: Download authentic 1 minute BID ASK OHLC for all four FX pairs
        env:
          M1_FROM: "${{ matrix.month }}-01"
          M1_TO: "${{ matrix.month_end }}-01"
          M1_MONTHS_PER_RUN: '4'
        run: node scripts/download_m1_four_pairs.mjs
      - name: Frozen reverse-sweep strategy versus continuation same-period control
        env:
          M1_FROM: "${{ matrix.month }}-01"
          M1_TO: "${{ matrix.month_end }}-01"
        run: python scripts/quantmind_m1_reclaim.py
      - name: Save source prices for reproducibility
        if: always()
        uses: actions/cache/save@v4
        with:
          path: m1_market
          key: quantmind-m1-${{ matrix.month }}-${{ github.run_id }}
      - name: Publish the original month report and all executions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantmind-m1-${{ matrix.month }}
          path: |
            m1_reclaim_results/
            m1_results/
          retention-days: 30
          if-no-files-found: warn
  cohorts:
    needs: monthly
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict aggregation dependencies
        run: python -m pip install -r requirements.txt
      - name: Download all 15 monthly artifacts without silently filling gaps
        uses: actions/download-artifact@v4
        with:
          pattern: quantmind-m1-*
          path: monthly_m1
          merge-multiple: false
      - name: Strictly audit and combine chronological cohorts
        run: python scripts/aggregate_quantmind_m1.py
      - name: Publish summary and complete unmodified monthly ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantmind-m1-fifteen-month-consolidated
          path: m1_multi_month_summary/
          retention-days: 30
          if-no-files-found: warn
