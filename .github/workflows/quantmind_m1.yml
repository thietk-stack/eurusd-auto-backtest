name: QuantMind v2 real M1 Bid Ask false-break reclaim pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/download_m1_four_pairs.mjs'
      - 'scripts/quantmind_m1_reclaim.py'
      - 'tests/test_quantmind_m1_reclaim.py'
      - '.github/workflows/quantmind_m1.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore SHA-verified authentic M1 archives if available
        uses: actions/cache/restore@v4
        with:
          path: m1_market
          key: quantmind-m1-2024-01-${{ github.run_id }}
          restore-keys: |
            quantmind-m1-2024-01-
      - name: Preflight strategy and quote integrity tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_quantmind_m1_reclaim.py
          python -m py_compile scripts/quantmind_m1_reclaim.py
          npm install --no-audit --no-fund
          node --check scripts/download_m1_four_pairs.mjs
      - name: Download four pairs actual Dukascopy one-minute BID ASK quotes
        env:
          M1_FROM: '2024-01-01'
          M1_TO: '2024-02-01'
          M1_MONTHS_PER_RUN: '4'
        run: node scripts/download_m1_four_pairs.mjs
      - name: Run preregistered reclaim and continuation controls on M1
        env:
          M1_FROM: '2024-01-01'
          M1_TO: '2024-02-01'
        run: python scripts/quantmind_m1_reclaim.py
      - name: Save real M1 data with original checksums for reproducibility
        if: always()
        uses: actions/cache/save@v4
        with:
          path: m1_market
          key: quantmind-m1-2024-01-${{ github.run_id }}
      - name: Publish transparent no-trading simulation and candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantmind-m1-price-reclaim-pilot-2024jan
          path: |
            m1_reclaim_results/
            m1_results/
          retention-days: 30
          if-no-files-found: warn
