name: A-plus confluence FX 4-pair risk-controlled research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/aplus_signals.py'
      - '.github/workflows/aplus.yml'
permissions:
  contents: read
jobs:
  aplus:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover verified EURUSD H1 data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: eurusd-history-41083461646
      - name: Recover verified GBP USD, AUD USD, USD JPY H1 data
        uses: actions/cache/restore@v4
        with:
          path: portfolio_data
          key: fx4-h1-41088543737
      - name: Install and verify implementation
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile scripts/aplus_signals.py scripts/portfolio_research.py
          python -m pytest -q tests/test_backtest.py
      - name: Fixed A+ backtest on four pairs, no synthetic data
        run: |
          python scripts/aplus_signals.py
      - name: Upload score diagnostics and all orders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aplus-fourpair-signal-study
          path: aplus_results
          retention-days: 30
          if-no-files-found: warn
