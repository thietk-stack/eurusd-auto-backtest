name: EconEdge 15 years 2011-2025 authentic H1 FX history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/econedge_15year.yml'
permissions:
  contents: read
jobs:
  fetch_early_years:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017]
        include:
          - {year: 2010, year_end: 2011}
          - {year: 2011, year_end: 2012}
          - {year: 2012, year_end: 2013}
          - {year: 2013, year_end: 2014}
          - {year: 2014, year_end: 2015}
          - {year: 2015, year_end: 2016}
          - {year: 2016, year_end: 2017}
          - {year: 2017, year_end: 2018}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original Dukascopy downloader
        run: npm install --no-audit --no-fund
      - name: Restore archived 2010-2017 year if previously SHA verified
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            portfolio_data
          key: econedge-early-${{ matrix.year }}-${{ github.run_id }}
          restore-keys: |
            econedge-early-${{ matrix.year }}-
      - name: Download year EURUSD genuine H1 Bid and Ask plus SHA256
        env:
          FROM: ${{ matrix.year }}-01-01
          TO: ${{ matrix.year_end }}-01-01
          MONTHS_PER_RUN: '12'
        run: node scripts/download.mjs
      - name: Download year GBPUSD AUDUSD USDJPY genuine H1 Bid Ask
        env:
          PORTFOLIO_FROM: ${{ matrix.year }}-01-01
          PORTFOLIO_TO: ${{ matrix.year_end }}-01-01
          MONTHS_PER_RUN: '36'
        run: node scripts/download_portfolio.mjs
      - name: Preserve verified year for future studies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            portfolio_data
          key: econedge-early-${{ matrix.year }}-${{ github.run_id }}
      - name: Upload ALL actual original year H1 quote CSVs AND SHA manifests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: econedge-verified-quotes-${{ matrix.year }}
          path: |
            data/
            portfolio_data/
          if-no-files-found: error
          retention-days: 30
  analyze_15_years:
    needs: fetch_early_years
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore audited 2018-2025 original four-pair H1 candles
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            portfolio_data
          key: limit-hist-2018-2025-41095941707
          restore-keys: |
            econedge-weekly-h1-
            limit-hist-2018-2025-
      - name: Fetch exactly eight annual artifacts from 2010 through 2017
        uses: actions/download-artifact@v4
        with:
          pattern: econedge-verified-quotes-*
          path: .
          merge-multiple: true
      - name: Validate committed research code and pre-registered rules
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_econedge_weekly_trend.py tests/test_econedge_long_15_years.py
          python -m py_compile scripts/econedge_weekly_trend.py scripts/econedge_long_2011_2025.py
      - name: Execute 15-year identical pair+week reversal vs trend, 8-week bootstrap
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python scripts/econedge_long_2011_2025.py
      - name: Publish 192 source-month audit, per-year reports and all trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econedge-15year-complete-2011-2025
          path: econedge_15year_results/
          retention-days: 30
          if-no-files-found: warn
