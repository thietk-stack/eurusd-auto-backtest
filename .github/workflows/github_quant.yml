name: Research GitHub EURUSD strategy versus quantitative TSMOM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/github_quant_compare.py'
      - '.github/workflows/github_quant.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore historical data, verified per-month SHA-256
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            .dukascopy-cache
          key: eurusd-history-41083461646
      - name: Validate code and execute fixed strategy comparisons
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile scripts/github_quant_compare.py
          python scripts/github_quant_compare.py
      - name: Save research results, including incomplete logs when applicable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eurusd-github-quant-comparison
          path: github_strategy_results/
          retention-days: 30
          if-no-files-found: warn
