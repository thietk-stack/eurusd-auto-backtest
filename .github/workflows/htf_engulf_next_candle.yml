name: Independent H1 and H4 engulfing next-candle limit yearly study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/htf_engulf_next_candle.py'
      - 'tests/test_htf_engulf_next_candle.py'
      - '.github/workflows/htf_engulf_next_candle.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore previously audited market-data caches
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            portfolio_data
          key: limit-hist-2018-2025-41095941707
          restore-keys: |
            limit-hist-2018-2025-
      - name: Validate code and limit-fill unit tests
        run: |
          python -m pip install -r requirements.txt
          npm install --no-audit --no-fund
          node --check scripts/download.mjs
          python -m py_compile scripts/htf_engulf_next_candle.py
          python -m pytest -q tests/test_htf_engulf_next_candle.py tests/test_backtest.py
      - name: Require actual EURUSD BID ASK price data 2018 through 2025
        env:
          FROM: '2018-01-01'
          TO: '2026-01-01'
          MONTHS_PER_RUN: '120'
        run: node scripts/download.mjs
      - name: Require actual GBPUSD AUDUSD USDJPY BID ASK price data 2018 through 2025
        env:
          PORTFOLIO_FROM: '2018-01-01'
          PORTFOLIO_TO: '2026-01-01'
          MONTHS_PER_RUN: '300'
        run: node scripts/download_portfolio.mjs
      - name: Backtest ONLY next H1 or ONLY next H4 candle 2019 through 2025
        run: python scripts/htf_engulf_next_candle.py
      - name: Save audited historical data for reproducibility
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            portfolio_data
          key: nextcandles-marketdata-${{ github.run_id }}
      - name: Upload results and all per-year trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-h4-one-next-candle-price-action-2019-2025
          path: next_candle_htf_results/
          if-no-files-found: warn
          retention-days: 30
