name: EconEdge official 3M interbank rate proxy currency pricing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/econedge_macro_rates_v1.yml'
      - 'scripts/econedge_macro_rate_proxy_v1.py'
      - 'tests/test_econedge_macro_rate_proxy_v1.py'
permissions:
  contents: read
  actions: read
jobs:
  oecd_fred_3m_rates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore authentic USD FX H1 2010-2025 original quote cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            portfolio_data
          key: winnerfx-historical-h1-41159566809
          restore-keys: |
            winnerfx-historical-h1-
            econedge-eurgbp-2010-2025-
      - name: Retrieve 2010–2017 original four pair Dukascopy H1 quote archives
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41152773799
          pattern: econedge-verified-quotes-*
          path: .
          merge-multiple: true
      - name: Validate five public 3-month OECD interest rate proxies without fictitious carry PnL
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_econedge_macro_rate_proxy_v1.py
          python -m py_compile scripts/econedge_macro_rate_proxy_v1.py
          npm install --no-audit --no-fund
      - name: Verify original EURUSD H1 2018–2025 source
        env:
          FROM: '2018-01-01'
          TO: '2026-01-01'
          MONTHS_PER_RUN: '96'
        run: node scripts/download.mjs
      - name: Verify original GBPUSD AUDUSD USDJPY H1 2018–2025 source
        env:
          PORTFOLIO_FROM: '2018-01-01'
          PORTFOLIO_TO: '2026-01-01'
          MONTHS_PER_RUN: '288'
        run: node scripts/download_portfolio.mjs
      - name: Try official public FRED monthly five currency rates, test ONLY spot price direction
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python scripts/econedge_macro_rate_proxy_v1.py
      - name: Export raw FRED source and truthful rate availability or study output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econedge-3month-rate-spotsignal-2011-2025
          path: econedge_macro_rates_v1_results/
          if-no-files-found: warn
          retention-days: 30
