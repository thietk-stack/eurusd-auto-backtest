name: Four-pair FX quantitative portfolio research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/download_portfolio.mjs'
      - 'scripts/portfolio_research.py'
      - '.github/workflows/portfolio.yml'
permissions:
  contents: read
jobs:
  fx_portfolio_research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover verified EURUSD H1 history
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            .dukascopy-cache
          key: eurusd-history-41083461646
          restore-keys: |
            eurusd-history-
      - name: Recover other FX pair history
        uses: actions/cache/restore@v4
        with:
          path: portfolio_data
          key: fx4-h1-${{ github.run_id }}
          restore-keys: |
            fx4-h1-
      - name: Validate implementation and install packages
        run: |
          node --check scripts/download_portfolio.mjs
          python -m py_compile scripts/portfolio_research.py
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_backtest.py
          npm install --no-audit --no-fund
      - name: Download genuine Dukascopy H1 bid and ask for remaining three pairs
        env:
          PORTFOLIO_FROM: '2020-01-01'
          PORTFOLIO_TO: '2026-10-30'
          MONTHS_PER_RUN: '300'
        run: |
          mkdir -p portfolio_data portfolio_results
          node scripts/download_portfolio.mjs
      - name: Run 4-pair benchmark with validation-only strategy selection
        run: python scripts/portfolio_research.py
      - name: Preserve verified downloaded FX months even if incomplete
        if: always()
        uses: actions/cache/save@v4
        with:
          path: portfolio_data
          key: fx4-h1-${{ github.run_id }}
      - name: Publish results and diagnostic status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx4-quant-portfolio-results
          path: portfolio_results
          retention-days: 30
          if-no-files-found: warn
