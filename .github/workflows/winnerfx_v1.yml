name: WinnerFX v1 follow large trends with small defined risks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/winnerfx_v1.yml'
      - 'scripts/winnerfx_v1.py'
      - 'tests/test_winnerfx_v1.py'
permissions:
  contents: read
  actions: read
jobs:
  winnerfx_multiyear_research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore SHA-verified existing historical BID ASK H1 market source
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            portfolio_data
          key: econedge-eurgbp-2010-2025-41158636720
          restore-keys: |
            econedge-eurgbp-2010-2025-
            limit-hist-2018-2025-
      - name: Restore genuine 2010–2017 historic four-pair quote archives
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41152773799
          pattern: econedge-verified-quotes-*
          path: .
          merge-multiple: true
      - name: Test frozen strategy and exact numerical risk invariants
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_winnerfx_v1.py
          python -m py_compile scripts/winnerfx_v1.py
          npm install --no-audit --no-fund
      - name: Verify 2018–2025 real EURUSD H1 BID ASK quotes
        env:
          FROM: '2018-01-01'
          TO: '2026-01-01'
          MONTHS_PER_RUN: '96'
        run: node scripts/download.mjs
      - name: Verify 2018–2025 genuine GBPUSD AUDUSD USDJPY H1 source
        env:
          PORTFOLIO_FROM: '2018-01-01'
          PORTFOLIO_TO: '2026-01-01'
          MONTHS_PER_RUN: '288'
        run: node scripts/download_portfolio.mjs
      - name: Run 3ATR nonwidening winner strategy vs opposite direction, two min lots
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python scripts/winnerfx_v1.py
      - name: Preserve verified market source for repeatable research
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            portfolio_data
          key: winnerfx-historical-h1-${{ github.run_id }}
      - name: Export trade decisions annual equity PnL sensitivity and original source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winnerfx-v1-2011-2025-audited
          path: winnerfx_v1_results/
          if-no-files-found: warn
          retention-days: 30
