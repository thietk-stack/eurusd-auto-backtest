name: EconEdge EURGBP 2026 year test frozen no real trading
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/econedge_eurgbp_2026_run.yml'
permissions:
  contents: read
jobs:
  historical_2026:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore original authentic H1 Dukascopy market records when available
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            portfolio_data
          key: econedge-eurgbp-2026-${{ github.run_id }}
          restore-keys: |
            econedge-eurgbp-2026-
            econedge-weekly-h1-
            limit-hist-2018-2025-
      - name: Validate 0.001-lot rounding correctness and fixed tests
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile scripts/econedge_2026_eurgbp.py scripts/econedge_weekly_trend.py
          python -m pytest -q tests/test_econedge_2026_eurgbp.py tests/test_econedge_weekly_trend.py
          npm install --no-audit --no-fund
          node --check scripts/download.mjs
          node --check scripts/download_portfolio.mjs
      - name: Get authentic EURUSD H1 BID ASK 2025-09 through 2026-09
        env:
          FROM: '2025-09-01'
          TO: '2026-10-01'
          MONTHS_PER_RUN: '13'
        run: node scripts/download.mjs
      - name: Get authentic GBPUSD H1 BID ASK with SHA256 verification
        env:
          PORTFOLIO_FROM: '2025-09-01'
          PORTFOLIO_TO: '2026-10-01'
          MONTHS_PER_RUN: '39'
        run: node scripts/download_portfolio.mjs
      - name: Re-evaluate 2026 EURGBP inverse vs trend and .01/.001 lot variants
        run: python scripts/econedge_2026_eurgbp.py
      - name: Save verified original 2026 H1 candles for reproducible future studies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            portfolio_data
          key: econedge-eurgbp-2026-${{ github.run_id }}
      - name: Preserve original quote source audit and every submitted or rejected trade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econedge-eurgbp-2026-verified-results
          path: econedge_2026_eurgbp_results/
          if-no-files-found: warn
          retention-days: 30
